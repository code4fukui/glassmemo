<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ee">
  <title>Glass Memo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">SABERA × BROWSER</p>
        <h1>Glass Memo</h1>
      </div>
      <button id="connectButton" class="connect-button" type="button">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="connectionLabel">グラスに接続</span>
      </button>
    </header>

    <section class="viewer" aria-label="メモ表示">
      <button id="memoCard" class="memo-card" type="button" aria-label="タップして次のメモを表示">
        <span class="tap-hint">TAP TO FLIP</span>
        <span id="memoText" class="memo-text"></span>
        <span id="memoIndex" class="memo-index"></span>
      </button>
      <p id="syncMessage" class="sync-message" role="status">カードまたはグラスをタップすると切り替わります</p>
    </section>

    <section class="composer" aria-label="メモを追加">
      <label for="memoInput">新しいメモ</label>
      <div class="input-row">
        <textarea id="memoInput" rows="2" maxlength="120" placeholder="思いついたことを書いて…"></textarea>
        <button id="addButton" class="add-button" type="button">追加</button>
      </div>
    </section>

    <section class="memo-list-section" aria-label="メモ一覧">
      <div class="section-heading">
        <h2>メモ一覧</h2>
        <span>EDIT / DELETE</span>
      </div>
      <div id="memoList" class="memo-list"></div>
    </section>

    <footer class="app-footer">
      <span id="memoCount">0 MEMOS</span>
      <button id="clearButton" class="text-button" type="button">すべて削除</button>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
